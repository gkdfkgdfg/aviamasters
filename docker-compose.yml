version: "3.9"

services:
  db:
    image: postgres:16
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/WarehouseManagement.Api/Dockerfile
    container_name: warehouse-api
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=warehouse_db;Username=warehouse_user;Password=warehouse_pwd
      Jwt__Issuer: warehouse-api
      Jwt__Audience: warehouse-clients
      Jwt__Secret: super_secret_development_key_1234567890
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
